{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resend Verification - AlkeaTech</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-blue-50 via-white to-purple-100 min-h-screen text-gray-900">
    <nav class="bg-white/80 backdrop-blur shadow sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center">
                <img src="https://cdn-icons-png.flaticon.com/512/2721/2721269.png" alt="AlkeaTech Logo" class="h-10 w-10 mr-2 drop-shadow-lg animate-bounce"/>
                <span class="font-extrabold text-2xl text-transparent bg-clip-text bg-gradient-to-r from-blue-700 to-purple-600 tracking-wide">AlkeaTech</span>
            </div>
            <div class="space-x-6">
                <a href="/" class="text-gray-700 hover:text-purple-600 font-semibold transition">Home</a>
                <a href="/courses/" class="text-gray-700 hover:text-purple-600 font-semibold transition">Courses</a>
                <a href="/projects/" class="text-gray-700 hover:text-purple-600 font-semibold transition">Projects</a>
                <a href="/register/" class="text-gray-700 hover:text-purple-600 font-semibold transition">Register</a>
                <a href="/student/login/" class="text-blue-700 font-semibold hover:text-purple-600 transition">Student Login</a>
                <a href="/contact/" class="text-gray-700 hover:text-purple-600 font-semibold transition">Contact</a>
            </div>
        </div>
    </nav>
    <main class="max-w-md mx-auto px-4 py-8 min-h-screen">
        <div id="toast-container" aria-live="polite" aria-atomic="true" class="fixed top-4 right-4 z-50"></div>
        <h2 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-700 to-purple-600 mb-6 text-center tracking-wide drop-shadow-lg">Resend Verification Email</h2>
        {% if messages %}
            <script>
                document.addEventListener('DOMContentLoaded', function() {
                    {% for message in messages %}
                    showToast("{{ message|escapejs }}");
                    {% endfor %}
                });
            </script>
        {% endif %}
        <form method="post" class="bg-white/90 rounded-2xl shadow-2xl p-8 border-2 border-purple-100" aria-label="Resend Verification Form">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block font-semibold text-gray-700 mb-2">Email *</label>
                <input type="email" name="email" required class="w-full border-2 border-purple-200 rounded-lg px-3 py-2 focus:border-purple-500 focus:outline-none transition"/>
            </div>
            <div class="mb-6">
                <label class="block font-semibold text-gray-700 mb-2">Phone *</label>
                <input type="text" name="phone" required class="w-full border-2 border-purple-200 rounded-lg px-3 py-2 focus:border-purple-500 focus:outline-none transition"/>
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-purple-500 text-white px-6 py-3 rounded-lg shadow-lg hover:from-purple-600 hover:to-blue-600 font-semibold transition transform hover:scale-105">Resend Verification Email</button>
        </form>
        <div class="text-center mt-6">
            <a href="/student/login/" class="text-purple-600 hover:text-purple-800 font-semibold transition">Back to Login</a>
        </div>
    </main>
    <script>
    function showToast(msg) {
        var container = document.getElementById('toast-container');
        var toast = document.createElement('div');
        toast.className = 'bg-gradient-to-r from-green-500 to-green-600 text-white px-6 py-3 rounded-lg shadow-lg mb-2 animate-bounce-in';
        toast.innerText = msg;
        container.appendChild(toast);
        setTimeout(function() { toast.remove(); }, 4000);
    }
    </script>
    <style>
    @keyframes bounce-in { 0% { transform: scale(0.9); opacity: 0; } 60% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); } }
    .animate-bounce-in { animation: bounce-in 0.5s; }
    </style>
</body>
</html>
