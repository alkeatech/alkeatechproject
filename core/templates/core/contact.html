{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact - AlkeaTech</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900">
    <nav class="bg-white shadow sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center">
                <img src="https://cdn-icons-png.flaticon.com/512/2721/2721269.png" alt="AlkeaTech Logo" class="h-8 w-8 mr-2"/>
                <span class="font-bold text-xl text-blue-700">AlkeaTech</span>
            </div>
            <div class="space-x-6">
                <a href="/" class="text-gray-700 hover:text-blue-700 font-medium">Home</a>
                <a href="/courses/" class="text-gray-700 hover:text-blue-700 font-medium">Courses</a>
                <a href="/register/" class="text-gray-700 hover:text-blue-700 font-medium">Register</a>
                <a href="/contact/" class="text-blue-700 font-medium">Contact</a>
            </div>
        </div>
    </nav>
    <main class="max-w-2xl mx-auto px-4 py-8 min-h-screen">
        <h2 class="text-2xl font-bold text-blue-700 mb-4">Contact Us</h2>
        <div class="mb-6">
            <h3 class="text-lg font-semibold mb-2">Our Offices</h3>
            <ul>
                {% for office in offices %}
                <li class="mb-2"><span class="font-semibold">{{ office.name }}:</span> {{ office.address }}</li>
                {% endfor %}
            </ul>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
            <h3 class="text-lg font-semibold mb-2">Send us a message</h3>
            <form method="post">
                {% csrf_token %}
                <div class="mb-2">
                    <label class="block font-medium">Your Name</label>
                    <input type="text" name="name" class="w-full border rounded px-2 py-1"/>
                </div>
                <div class="mb-2">
                    <label class="block font-medium">Your Email</label>
                    <input type="email" name="email" class="w-full border rounded px-2 py-1"/>
                </div>
                <div class="mb-2">
                    <label class="block font-medium">Message</label>
                    <textarea name="message" class="w-full border rounded px-2 py-1" rows="4"></textarea>
                </div>
                <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded shadow hover:bg-blue-700 font-semibold mt-2">Send</button>
            </form>
        </div>
    </main>
</body>
</html>
