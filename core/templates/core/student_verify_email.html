{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Verification - AlkeaTech</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900">
    <nav class="bg-white shadow sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center">
                <img src="https://cdn-icons-png.flaticon.com/512/2721/2721269.png" alt="AlkeaTech Logo" class="h-8 w-8 mr-2"/>
                <span class="font-bold text-xl text-blue-700">AlkeaTech</span>
            </div>
            <div class="space-x-6">
                <a href="/" class="text-gray-700 hover:text-blue-700 font-medium">Home</a>
                <a href="/student/login/" class="text-blue-700 font-medium">Student Login</a>
            </div>
        </div>
    </nav>
    <main class="max-w-md mx-auto px-4 py-8 min-h-screen">
        <h2 class="text-2xl font-bold text-blue-700 mb-4">Email Verification</h2>
        <div class="bg-white rounded-lg shadow p-6">
            <div class="text-lg">{{ msg }}</div>
            <a href="/student/login/" class="text-blue-600 underline mt-4 inline-block">Go to Login</a>
        </div>
    </main>
</body>
</html>
