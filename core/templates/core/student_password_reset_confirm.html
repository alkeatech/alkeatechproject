{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Set New Password - AlkeaTech</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900">
    <nav class="bg-white shadow sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center">
                <img src="https://cdn-icons-png.flaticon.com/512/2721/2721269.png" alt="AlkeaTech Logo" class="h-8 w-8 mr-2"/>
                <span class="font-bold text-xl text-blue-700">AlkeaTech</span>
            </div>
            <div class="space-x-6">
                <a href="/" class="text-gray-700 hover:text-blue-700 font-medium">Home</a>
                <a href="/student/login/" class="text-blue-700 font-medium">Student Login</a>
            </div>
        </div>
    </nav>
    <main class="max-w-md mx-auto px-4 py-8 min-h-screen">
        <h2 class="text-2xl font-bold text-blue-700 mb-4">Set New Password</h2>
        {% if error %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">{{ error }}</div>
        {% endif %}
        {% if success %}
        <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4">{{ success }}</div>
        <a href="/student/login/" class="text-blue-600 underline">Go to Login</a>
        {% elif not error %}
        <form method="post" class="bg-white rounded-lg shadow p-6">
            {% csrf_token %}
            <div class="mb-2">
                <label class="block font-medium">New Password</label>
                <input type="password" name="password" required class="w-full border rounded px-2 py-1"/>
            </div>
            <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded shadow hover:bg-blue-700 font-semibold mt-2">Set Password</button>
        </form>
        {% endif %}
    </main>
</body>
</html>
